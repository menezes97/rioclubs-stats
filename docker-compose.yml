services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-rioclubs}
      POSTGRES_USER: ${DB_USER:-rioclubs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rioclubs}
    ports:
      - "5433:5432"
    volumes:
      - rioclubs-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rioclubs} -d ${DB_NAME:-rioclubs}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rioclubs-db:
